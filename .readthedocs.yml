version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    install:
      - python -m pip install -r docs/requirements.txt
    build:
      html:
        - python scripts/build_docs.py
    post_build:
      - mkdir -p "$READTHEDOCS_OUTPUT/html/"
      - cp -a site/. "$READTHEDOCS_OUTPUT/html/"
