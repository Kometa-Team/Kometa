[project]
docs_dir = "docs"
site_dir = "site"
watch = ["docs/templates", "docs/docs-extension/src/kometa_docs", "CHANGELOG.md"]
copyright = "Copyright &copy; 2026 meisnate12"
exclude_docs = "/templates/\n/overrides/\n/requirements.txt\n/docs-extension/\n"
site_name = "Kometa Wiki"
site_author = "meisnate12"
site_description = "Kometa is an open-source python project allowing you to unlock the potential of your media server."
site_url = "https://kometa.wiki/en/latest/"
repo_name = "Kometa"
repo_url = "https://github.com/Kometa-Team/Kometa"
extra_css = [
    "assets/css/extra.css",
    "assets/css/install-guide.css",
    "https://unpkg.com/tippy.js@6/dist/tippy.css",
]
extra_javascript = [
    "assets/js/extra.js",
    "assets/js/install-guide.js",
    "https://unpkg.com/@popperjs/core@2",
    "https://unpkg.com/tippy.js@6",
    "assets/js/external-links.js",
]

[project.theme]
name = "zensical"
logo = "assets/images/icons/icon.png"
favicon = "assets/images/icons/favicon.png"
custom_dir = "docs/overrides"
features = [
    "content.code.annotate",
    "content.tabs.link",
    "content.code.copy",
    "announce.dismiss",
    "navigation.path",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
]
language = "en"
variant = "modern"

[project.theme.palette]
scheme = "slate"
primary = "custom"

[project.plugins.search]

[project.plugins.glightbox]

[project.plugins.redirects.redirect_maps]
"discord.md" = "https://discord.com/invite/kometa-822460010649878528"
"redact.md" = "https://regex101.com/r/DMo1DQ/latest"
"link.md" = "https://discord.com/invite/kometa-822460010649878528"

[[project.extra.social]]
icon = "fontawesome/solid/heart"
class = "md-social__link heart"
link = "https://github.com/sponsors/meisnate12"
name = "Donate"

[[project.extra.social]]
icon = "fontawesome/brands/discord"
class = "md-social__link"
link = "https://kometa.wiki/en/latest/discord/"
name = "Discord"

[[project.extra.social]]
icon = "fontawesome/brands/github"
class = "md-social__link"
link = "https://github.com/Kometa-Team/Kometa"
name = "GitHub"

[project.extra.analytics]
provider = "plausible"
domain = "kometa.wiki"
src = "https://analytics.kometa.wiki/js/script.js"

[project.markdown_extensions.abbr]

[project.markdown_extensions.admonition]

[project.markdown_extensions.attr_list]

[project.markdown_extensions.md_in_html]

[project.markdown_extensions."pymdownx.details"]

[project.markdown_extensions."pymdownx.emoji"]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"

[project.markdown_extensions."pymdownx.highlight"]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.markdown_extensions."pymdownx.inlinehilite"]

[project.markdown_extensions."pymdownx.snippets"]
base_path = [".", "docs"]
check_paths = true

[project.markdown_extensions.kometa_docs]

[project.markdown_extensions."pymdownx.superfences"]

[project.markdown_extensions."pymdownx.tabbed"]
alternate_style = true

[project.markdown_extensions."pymdownx.tabbed".slugify]
object = "pymdownx.slugs.slugify"

[project.markdown_extensions."pymdownx.tabbed".slugify.kwds]
case = "lower"

[project.markdown_extensions."pymdownx.tasklist"]
custom_checkbox = true

[project.markdown_extensions."pymdownx.tilde"]

[project.markdown_extensions.tables]

[project.markdown_extensions.toc]
title = "Contents"
permalink = true
toc_depth = 3

