name: Docker Test Build

on:
  pull_request:
    branches: [ nightly ]
    paths:
      - Dockerfile
      - requirements.txt
      - .github/workflows/docker-test.yml
      - .github/workflows/docker-nightly.yml
  workflow_dispatch:
    inputs:
      platform:
        description: Docker platform to build
        required: true
        default: all
        type: choice
        options:
          - all
          - linux/amd64
          - linux/arm64
          - linux/arm/v7

jobs:

  docker-test-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            cache-scope: docker-test-amd64
            nightly-cache-scope: docker-nightly-amd64
          - platform: linux/arm64
            cache-scope: docker-test-arm64
            nightly-cache-scope: docker-nightly-arm64
          - platform: linux/arm/v7
            cache-scope: docker-test-armv7
            nightly-cache-scope: docker-nightly-armv7
    steps:

      - name: Check Out Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        if: ${{ github.event_name == 'pull_request' || github.event.inputs.platform == 'all' || github.event.inputs.platform == matrix.platform }}
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: all

      - name: Set up Docker Buildx
        if: ${{ github.event_name == 'pull_request' || github.event.inputs.platform == 'all' || github.event.inputs.platform == matrix.platform }}
        id: buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
        with:
          driver-opts: |
            image=moby/buildkit:v0.20.0

      - name: Build Docker Image
        if: ${{ github.event_name == 'pull_request' || github.event.inputs.platform == 'all' || github.event.inputs.platform == matrix.platform }}
        id: docker_build
        run: |
          docker buildx build \
            --build-arg BRANCH_NAME=${{ github.ref_name }} \
            --file ./Dockerfile \
            --platform ${{ matrix.platform }} \
            --tag kometa-test:${{ matrix.cache-scope }} \
            --load \
            .

      - name: Verify venv entrypoint with overridden PATH
        if: ${{ github.event_name == 'pull_request' || github.event.inputs.platform == 'all' || github.event.inputs.platform == matrix.platform }}
        run: |
          entrypoint=$(docker image inspect --format '{{json .Config.Entrypoint}}' kometa-test:${{ matrix.cache-scope }})
          if [ "$entrypoint" != '["/tini","-s","/.venv/bin/python3","kometa.py","--"]' ]; then
            echo "ERROR: unexpected entrypoint: $entrypoint"
            exit 1
          fi
          docker run --rm \
            --env PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            --entrypoint /.venv/bin/python3 \
            kometa-test:${{ matrix.cache-scope }} \
            -c "import packaging; print(packaging.__version__)"
