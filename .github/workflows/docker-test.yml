name: Docker Test Build

on:
  pull_request:
    branches: [ nightly ]
    paths:
      - Dockerfile
      - requirements.txt
      - .github/workflows/docker-test.yml
      - .github/workflows/docker-nightly.yml
  workflow_dispatch:
    inputs:
      platform:
        description: Docker platform to build
        required: true
        default: all
        type: choice
        options:
          - all
          - linux/amd64
          - linux/arm64
          - linux/arm/v7

jobs:

  docker-test-build:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      packages: write
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            cache-scope: docker-test-amd64
            nightly-cache-scope: docker-nightly-amd64
          - platform: linux/arm64
            cache-scope: docker-test-arm64
            nightly-cache-scope: docker-nightly-arm64
          - platform: linux/arm/v7
            cache-scope: docker-test-armv7
            nightly-cache-scope: docker-nightly-armv7
    steps:

      - name: Check Out Repo
        uses: actions/checkout@v7

      - name: Set up QEMU
        if: ${{ github.event_name == 'pull_request' || github.event.inputs.platform == 'all' || github.event.inputs.platform == matrix.platform }}
        uses: docker/setup-qemu-action@master
        with:
          platforms: all

      - name: Setup Blacksmith Builder
        if: ${{ github.event_name == 'pull_request' || github.event.inputs.platform == 'all' || github.event.inputs.platform == matrix.platform }}
        uses: useblacksmith/setup-docker-builder@v1

      - name: Build Docker Image
        if: ${{ github.event_name == 'pull_request' || github.event.inputs.platform == 'all' || github.event.inputs.platform == matrix.platform }}
        id: docker_build
        run: |
          docker buildx build \
            --build-arg BRANCH_NAME=${{ github.ref_name }} \
            --file ./Dockerfile \
            --platform ${{ matrix.platform }} \
            --load \
            .
