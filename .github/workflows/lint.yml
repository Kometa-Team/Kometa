name: Lint and Format Check

on:
  push:
    branches: [ disabled_for_now ]
  pull_request:
    branches: [ disabled_for_now ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.12'

    - name: Cache pip packages
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt', '**/dev-requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r dev-requirements.txt

    - name: Run prek hooks
      run: |
        prek run --all-files --show-diff-on-failure

    - name: Run Black check
      run: |
        black --check --diff modules/ tests/ *.py

    - name: Run isort check
      run: |
        isort --check-only --diff modules/ tests/ *.py

    - name: Run flake8
      run: |
        flake8 modules/ tests/ *.py --max-line-length=256 --extend-ignore=E203,W503

    - name: Run mypy
      run: |
        mypy modules/
      continue-on-error: true

    - name: Run bandit security check
      run: |
        bandit -r modules/ -c pyproject.toml
      continue-on-error: true
