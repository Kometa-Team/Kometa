name: Develop Release

on:
  workflow_dispatch: {}
  push:
    branches: [nightly]

jobs:
  release-develop:
    runs-on: ubuntu-latest
    steps:

      - name: Create App Token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_TOKEN }}

      - name: Check Out Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: nightly
          fetch-depth: 0

      - name: Push Nightly to Develop
        id: forward
        run: |
            hash=$(git rev-parse HEAD)
            echo "Pushing Nightly (${hash}) to Develop"
            git push origin HEAD:refs/heads/develop
            echo "build=${hash}" >> $GITHUB_OUTPUT
            value=$(cat VERSION)
            echo "version=${value%-build*}" >> $GITHUB_OUTPUT
            echo "build-value=${value#*-build}" >> $GITHUB_OUTPUT
            echo "commit-msg=$(git log -1 HEAD --pretty=format:%s | sed -E 's/^\[[0-9]+\] //')" >> $GITHUB_OUTPUT

      - name: Discord Success Notification
        uses: Kometa-Team/discord-notifications@a85936f9279e70814cf315a0eaacc0063e98a087 # master
        if: success()
        with:
          webhook_id_token: ${{ secrets.BUILD_WEBHOOK }}
          title: "${{ vars.REPO_NAME }} develop synced to nightly (${{ steps.forward.outputs.build }}): ${{ vars.TEXT_SUCCESS }}"
          url: https://github.com/Kometa-Team/${{ vars.REPO_NAME }}/actions/runs/${{ github.run_id }}
          color: ${{ vars.COLOR_SUCCESS }}
          username: ${{ vars.BOT_NAME }}
          avatar_url: ${{ vars.BOT_IMAGE }}
          author: ${{ vars.GIT_NAME }}
          author_icon_url: ${{ vars.GIT_IMAGE }}

      - name: Discord Develop Update Notification
        uses: Kometa-Team/discord-notifications@a85936f9279e70814cf315a0eaacc0063e98a087 # master
        if: success()
        with:
          webhook_id_token: ${{ secrets.DEVELOP_WEBHOOK }}
          title: ${{ vars.NAME }} ${{ steps.forward.outputs.version }} Build ${{ steps.forward.outputs.build-value }}
          url: https://github.com/Kometa-Team/${{ vars.REPO_NAME }}/commit/${{ steps.forward.outputs.build }}
          description: ${{ steps.forward.outputs.commit-msg }}
          message: "${{ vars.DEVELOP_ROLE }} - An update to ${{ vars.NAME }} has now been published and is available to users of the **develop** branch."
          color: ${{ vars.COLOR_SUCCESS }}
          username: ${{ vars.BOT_NAME }}
          avatar_url: ${{ vars.BOT_IMAGE }}
          author: ${{ vars.REPO_NAME }} Develop Release
          author_icon_url: ${{ vars.RELEASE_IMAGE }}

      - name: Discord Failure Notification
        uses: Kometa-Team/discord-notifications@a85936f9279e70814cf315a0eaacc0063e98a087 # master
        if: failure()
        with:
          webhook_id_token: ${{ secrets.BUILD_WEBHOOK }}
          message: ${{ vars.BUILD_FAILURE_ROLE }}
          title: "${{ vars.REPO_NAME }} develop sync to nightly: ${{ vars.TEXT_FAILURE }}"
          url: https://github.com/Kometa-Team/${{ vars.REPO_NAME }}/actions/runs/${{ github.run_id }}
          color: ${{ vars.COLOR_FAILURE }}
          username: ${{ vars.BOT_NAME }}
          avatar_url: ${{ vars.BOT_IMAGE }}
          author: ${{ vars.GIT_NAME }}
          author_icon_url: ${{ vars.GIT_IMAGE }}
