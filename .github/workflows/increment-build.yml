name: Increment Build

on:
  pull_request_target:
    branches: [nightly]
    types: [closed]

concurrency:
  group: increment-build-nightly
  cancel-in-progress: false

jobs:

  verify-changes:
    runs-on: ubuntu-latest
    if: github.base_ref == 'nightly' && github.event.pull_request.merged
    outputs:
      build: ${{ steps.list-changes.outputs.build }}
      base: ${{ steps.list-changes.outputs.base }}
    steps:

      - name: Check Out Repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: nightly

      - name: Get changes
        id: get-changes
        # Diffs the actual merge commit's own parents -- correct even if something else lands on nightly before this job runs.
        run: echo "files=$(git diff --name-only ${{ github.event.pull_request.merge_commit_sha }}^1..${{ github.event.pull_request.merge_commit_sha }} | xargs)" >> $GITHUB_OUTPUT

      - name: List changed files
        id: list-changes
        run: |
            for file in ${{ steps.get-changes.outputs.files }}; do
                if [[ $file =~ ^(defaults|fonts|modules|kometa.py|requirements.txt|.dockerignore|Dockerfile).*$ ]] ; then
                    echo "$file will trigger docker build"
                    echo "build=true" >> $GITHUB_OUTPUT
                else
                    echo "$file will not trigger docker build"
                fi
                if [[ $file == "requirements.txt" || $file == "Dockerfile.base" ]]; then
                    echo "$file will trigger docker base build"
                    echo "base=true" >> $GITHUB_OUTPUT
                fi
            done

  increment-build:
    runs-on: ubuntu-latest
    needs: [ verify-changes ]
    if: needs.verify-changes.outputs.build == 'true'
    outputs:
      version: ${{ steps.update-version.outputs.version }}
      build-value: ${{ steps.update-version.outputs.build-value }}
      commit-msg: ${{ steps.update-version.outputs.commit-msg }}
      commit-hash: ${{ steps.update-version.outputs.commit-hash }}
      commit-short: ${{ steps.update-version.outputs.commit-short }}
      pr-tag: ${{ steps.update-version.outputs.pr-tag }}
      bump-commit-hash: ${{ steps.update-version.outputs.bump-commit-hash }}
    steps:

      - name: Create App Token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_TOKEN }}

      - name: Check Out Repo
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: nightly
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install Requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Sponsors
        env:
          GITHUB_PAT: ${{ secrets.PAT2 }}
        run: python .github/python/update_sponsors.py

      - name: Update VERSION File
        id: update-version
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
            branch_name="${GITHUB_HEAD_REF}"
            branch_name=$(echo "${branch_name}" | sed 's/[^a-zA-Z0-9._-]/-/g')
            repo_name="${HEAD_REPO}"
            base_name="${repo_name%/*}"
            if [[ "${branch_name}" =~ ^(master|develop|nightly)$ ]]; then
                pr_tag="${base_name}"
            else
                pr_tag="${branch_name}"
            fi
            echo "pr-tag=${pr_tag}" >> $GITHUB_OUTPUT

            value=$(cat VERSION)
            old_msg=$(git log -1 HEAD --pretty=format:%s)
            version="${value%-build*}"

            if [[ "$value" == *"-"* ]]; then
                build_value="$((${value#*-build} + 1))"
            else
                build_value="1"
            fi

            new_value="${version}-build${build_value}"
            new_msg="[${build_value}] ${old_msg}"

            echo "version=${version}" >> $GITHUB_OUTPUT
            echo "build-value=${build_value}" >> $GITHUB_OUTPUT
            echo "commit-msg=${old_msg}" >> $GITHUB_OUTPUT
            # Captured before the bump commit -- points at the real merge commit, which stays reachable on nightly since nothing amends it away.
            echo "commit-hash=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
            echo "commit-short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

            echo "$new_value" > "VERSION"
            # Defensive reset -- scrubs any PART value a PR might still carry from the old commit-based flow.
            echo "" > "PART"
            git config --local user.email "action@github.com"
            git config --local user.name "GitHub Action"
            git add README.md
            git add VERSION
            git add PART
            # Normal follow-up commit + fast-forward push, no amend/force -- concurrency group above serializes runs so merges can't race each other.
            git commit -m "${new_msg}"
            git push origin nightly
            echo "bump-commit-hash=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

  docker-build-base:
    runs-on: ubuntu-latest
    needs: [ increment-build, verify-changes ]
    if: needs.verify-changes.outputs.base == 'true'
    steps:

      - name: Check Out Repo
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.increment-build.outputs.bump-commit-hash }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4.5.2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@master
        with:
          platforms: all

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: |
            image=moby/buildkit:v0.20.0

      - name: Build and Push Base Image
        uses: docker/build-push-action@v7
        with:
          context: ./
          file: ./Dockerfile.base
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: |
            ${{ vars.DOCKER_TEAM }}/${{ vars.DOCKER_REPO }}:base
            ${{ vars.DOCKER_TEAM }}/${{ vars.DOCKER_REPO }}:base-${{ needs.increment-build.outputs.bump-commit-hash }}
          cache-from: type=registry,ref=${{ vars.DOCKER_TEAM }}/${{ vars.DOCKER_REPO }}:buildcache-base
          cache-to: type=registry,ref=${{ vars.DOCKER_TEAM }}/${{ vars.DOCKER_REPO }}:buildcache-base,mode=max

  docker-build-nightly:
    runs-on: ubuntu-latest
    needs: [ increment-build, verify-changes, docker-build-base ]
    if: >-
      always() &&
      needs.verify-changes.outputs.build == 'true' &&
      (needs.docker-build-base.result == 'success' || needs.docker-build-base.result == 'skipped')
    steps:

      # Checks out the bump commit itself (has both the merged code and new VERSION/PART), not a mutable nightly ref -- closes the race with later pushes.
      - name: Check Out Repo
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.increment-build.outputs.bump-commit-hash }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4.5.2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@master
        with:
          platforms: all

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: |
            image=moby/buildkit:v0.20.0

      - name: Build and Push
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          context: ./
          file: ./Dockerfile
          build-args: |
            "BRANCH_NAME=nightly"
            "BASE_TAG=${{ needs.verify-changes.outputs.base == 'true' && format('base-{0}', needs.increment-build.outputs.bump-commit-hash) || 'base' }}"
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ vars.DOCKER_TEAM }}/${{ vars.DOCKER_REPO }}:nightly
          cache-from: type=registry,ref=${{ vars.DOCKER_TEAM }}/${{ vars.DOCKER_REPO }}:buildcache-nightly
          cache-to: type=registry,ref=${{ vars.DOCKER_TEAM }}/${{ vars.DOCKER_REPO }}:buildcache-nightly,mode=min
      - name: Discord Success Notification
        uses: Kometa-Team/discord-notifications@master
        if: success()
        with:
          webhook_id_token: ${{ secrets.BUILD_WEBHOOK }}
          title: "${{ vars.NAME }} nightly: ${{ vars.TEXT_SUCCESS }}"
          url: https://github.com/Kometa-Team/${{ vars.REPO_NAME }}/actions/runs/${{ github.run_id }}
          color: ${{ vars.COLOR_SUCCESS }}
          username: ${{ vars.BOT_NAME }}
          avatar_url: ${{ vars.BOT_IMAGE }}
          author: ${{ vars.DOCKER_NAME }}
          author_icon_url: ${{ vars.DOCKER_IMAGE }}

      - name: Discord Failure Notification
        uses: Kometa-Team/discord-notifications@master
        if: failure()
        with:
          webhook_id_token: ${{ secrets.BUILD_WEBHOOK }}
          message: ${{ vars.BUILD_FAILURE_ROLE }}
          title: "${{ vars.NAME }} nightly: ${{ vars.TEXT_FAILURE }}"
          url: https://github.com/Kometa-Team/${{ vars.REPO_NAME }}/actions/runs/${{ github.run_id }}
          color: ${{ vars.COLOR_FAILURE }}
          username: ${{ vars.BOT_NAME }}
          avatar_url: ${{ vars.BOT_IMAGE }}
          author: ${{ vars.DOCKER_NAME }}
          author_icon_url: ${{ vars.DOCKER_IMAGE }}

  commit-notification:
    runs-on: ubuntu-latest
    needs: [ increment-build, verify-changes, docker-build-base, docker-build-nightly ]
    if: ${{ success() && needs.verify-changes.outputs.build == 'true' }}
    steps:

      - name: Send Discord Commit Notification
        uses: Kometa-Team/discord-notifications@master
        with:
          webhook_id_token: ${{ secrets.NIGHTLY_WEBHOOK }}
          title: ${{ vars.NAME }} ${{ needs.increment-build.outputs.version }} Build ${{ needs.increment-build.outputs.build-value }}
          url: https://github.com/Kometa-Team/${{ vars.REPO_NAME }}/commit/${{ needs.increment-build.outputs.commit-hash }}
          description: ${{ needs.increment-build.outputs.commit-msg }}
          message: "${{ vars.NIGHTLY_ROLE }} - An update to ${{ vars.NAME }} has now been published and is available to users of the **nightly** branch."
          color: ${{ vars.COLOR_SUCCESS }}
          username: ${{ vars.BOT_NAME }}
          avatar_url: ${{ vars.BOT_IMAGE }}
          author: ${{ vars.REPO_NAME }} Nightly Release
          author_icon_url: ${{ vars.RELEASE_IMAGE }}
