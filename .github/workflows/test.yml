# ─────────────────────────────────────────────────────────────────────────────
# Testing & Quality Gates
#
# Called as a job (workflow_call) from ci.yml for PRs targeting nightly; also runs standalone on push to nightly for post-merge validation.
#
# Gates:
#   lint  — formatting, lint, and security checks (ubuntu)
#   test  — full suite, run in parallel (pytest-xdist), including schemas,
#           fresh-process imports, regressions, per-test timeouts and duration
#           reporting, on Python 3.12 (the minimum) and 3.13 (the Docker image's
#           version) across ubuntu + windows; line coverage is measured and
#           enforced once, on ubuntu with 3.13
#   smoke — real CLI --help and an asserted missing-config diagnostic
#           (same matrix as test)
#
# The three jobs are independent and run in parallel.
# ─────────────────────────────────────────────────────────────────────────────
name: Tests

on:
  workflow_call:
  push:
    branches: [nightly]

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ── 1. Lint & Format ────────────────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        uses: ./.github/actions/setup-env

      - name: Black check
        run: black --check --diff modules/ tests/ ./*.py

      - name: isort check
        run: isort --check-only --diff modules/ tests/ ./*.py

      - name: flake8
        run: flake8 modules/ tests/ ./*.py --max-line-length=256 --extend-ignore=E203,W503

      - name: bandit
        run: bandit -r modules/ -c pyproject.toml
        continue-on-error: true

  # ── 2. Full Test Suite ──────────────────────────────────────────────────────
  # Matrix: ubuntu + windows on the minimum Python (3.12) and the Docker image's (3.13).
  # The Windows legs exist to catch OS-specific failures (path handling, FD APIs,
  # subprocess differences). Coverage is measured and gated on one leg only
  # (ubuntu, 3.13); pytest-xdist spreads each run across the runner's cores.
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
        include:
          - os: ubuntu-latest
            python: "3.13"
            coverage: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        uses: ./.github/actions/setup-env

      # The floor is the measured total (about 51%) minus a 2-point margin for Python-version and OS differences; raise it when coverage rises.
      - name: Run pytest with coverage
        if: matrix.coverage
        run: python -m pytest tests/ -n auto --cov=modules --cov-report=term --cov-report=xml:coverage.xml --cov-fail-under=48 --timeout=30 --durations=10 --durations-min=2.0 --tb=short

      - name: Run pytest
        if: ${{ !matrix.coverage }}
        run: python -m pytest tests/ -n auto --timeout=30 --durations=10 --durations-min=2.0 --tb=short

      - name: Upload coverage report
        if: matrix.coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage.xml

  # Fresh-process imports, schema validation, regressions, and timing are all
  # covered by the main test job. Keep CLI startup separate on every leg.
  smoke:
    name: smoke (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: "Run Kometa --help (verifies module-level imports + argparse setup)"
        run: |
          python kometa.py --help

      - name: Verify missing config produces the expected diagnostic
        run: |
          python - <<'PYCODE'
          import os
          import subprocess
          import sys
          from pathlib import Path
          from tempfile import TemporaryDirectory

          with TemporaryDirectory(dir=os.environ["RUNNER_TEMP"]) as directory:
              missing = Path(directory) / "missing-config.yml"
              result = subprocess.run(
                  [sys.executable, "kometa.py", "--run", "--config", str(missing)],
                  capture_output=True, text=True, timeout=120,
              )
          output = result.stdout + result.stderr
          print(output)
          # Kometa currently logs configuration failures and returns zero.
          assert result.returncode == 0, f"Unexpected exit code: {result.returncode}"
          assert f"Config Error: Configuration file (config.yml) not found at {missing}" in output
          assert "Uncaught Exception" not in output
          assert "Traceback (most recent call last)" not in output
          PYCODE
