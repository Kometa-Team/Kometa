# ─────────────────────────────────────────────────────────────────────────────
# Testing & Quality Gates
#
# Called as a job (workflow_call) from ci.yml for PRs targeting nightly; also runs standalone on push to nightly for post-merge validation.
#
# Gates:
#   lint  — formatting, lint, and security checks (ubuntu)
#   test  — full suite, including schemas, fresh-process imports, regressions,
#           per-test timeouts and duration reporting (ubuntu + windows)
#   smoke — real CLI --help and an asserted missing-config diagnostic
#           (ubuntu + windows)
# ─────────────────────────────────────────────────────────────────────────────
name: Tests

on:
  workflow_call:
  push:
    branches: [nightly]

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ── 1. Lint & Format ────────────────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        uses: ./.github/actions/setup-env

      - name: Black check
        run: black --check --diff modules/ tests/ *.py

      - name: isort check
        run: isort --check-only --diff modules/ tests/ *.py

      - name: flake8
        run: flake8 modules/ tests/ *.py --max-line-length=256 --extend-ignore=E203,W503

      - name: bandit
        run: bandit -r modules/ -c pyproject.toml
        continue-on-error: true

  # ── 2. Full Test Suite + Coverage Gate ─────────────────────────────────────
  # Matrix: ubuntu + windows. Coverage gate only enforced on ubuntu — Windows
  # leg exists to catch OS-specific test failures (path handling, FD APIs,
  # subprocess differences), not to ratchet coverage twice.
  test:
    runs-on: ${{ matrix.os }}
    # Fail-fast: don't bother running other jobs if lint failed
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        uses: ./.github/actions/setup-env

      - name: Run pytest with coverage
        run: |
          python -m pytest tests/ --cov=modules --cov-report=term-missing --cov-report=xml:coverage.xml --timeout=30 --durations=10 --durations-min=2.0 --tb=short -v

      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage.xml

      - name: Enforce minimum coverage
        if: matrix.os == 'ubuntu-latest'
        run: |
          python -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('coverage.xml')
          root = tree.getroot()
          covered = float(root.attrib['line-rate'])
          threshold = 0.20  # 20% — measured baseline is ~23%; ratchet up as coverage grows
          pct = covered * 100
          print(f'Total line coverage: {pct:.1f}%')
          if covered < threshold:
              print(f'FAIL: coverage {pct:.1f}% is below {threshold*100}%')
              exit(1)
          print('Coverage gate PASSED')
          "

  # Fresh-process imports, schema validation, regressions, and timing are all
  # covered by the main test job. Keep CLI startup separate on both platforms.
  smoke:
    runs-on: ${{ matrix.os }}
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: "Run Kometa --help (verifies module-level imports + argparse setup)"
        run: |
          python kometa.py --help

      - name: Verify missing config produces the expected diagnostic
        run: |
          python - <<'PYCODE'
          import os
          import subprocess
          import sys
          from pathlib import Path
          from tempfile import TemporaryDirectory

          with TemporaryDirectory(dir=os.environ["RUNNER_TEMP"]) as directory:
              missing = Path(directory) / "missing-config.yml"
              result = subprocess.run(
                  [sys.executable, "kometa.py", "--run", "--config", str(missing)],
                  capture_output=True, text=True, timeout=120,
              )
          output = result.stdout + result.stderr
          print(output)
          # Kometa currently logs configuration failures and returns zero.
          assert result.returncode == 0, f"Unexpected exit code: {result.returncode}"
          assert f"Config Error: Configuration file (config.yml) not found at {missing}" in output
          assert "Uncaught Exception" not in output
          assert "Traceback (most recent call last)" not in output
          PYCODE
