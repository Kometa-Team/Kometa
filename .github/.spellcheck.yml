matrix:
- name: Markdown
  sources:
  - .github/CONTRIBUTING.md
  - '**/*.md|!AGENTS.md|!**/MODULE.md|!config/**|!test_venv/**|!.direnv/**|!.github/**|!.mypy_cache/**|!.pytest_cache/**|!.ruff_cache/**|!.vscode/**|!docs/superpowers/**|!docs/kometa/acknowledgements.md|!CHANGELOG.md'
  aspell:
    lang: en
    ignore-case: true
  dictionary:
    wordlists:
    - .github/.wordlist.txt
    encoding: utf-8
  pipeline:
  # Exclude fenced examples, including titles, attributes, and indented fences.
  - pyspelling.filters.context:
      context_visible_first: true
      delimiters:
      - open: '^[ \t]*(?P<fence>`{3,}|~{3,})[^\n]*\n'
        close: '^[ \t]*(?P=fence)[ \t]*$'
        content: '(?s:.*?)'
  - pyspelling.filters.markdown:
  - pyspelling.filters.html:
      comments: false
      ignores:
      - code
      - pre
  default_encoding: utf-8
