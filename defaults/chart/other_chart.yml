##############################################################################

external_templates:
  default: templates
  template_variables:
    collection_section: "020"
    image: chart/<<style>>/<<mapping_name_encoded>>

templates:
  commonsense:
    mdblist_list: https://mdblist.com/lists/k0meta/cssfamilies<<library_type>>s
  metacritic:
    mdblist_list: https://mdblist.com/lists/k0meta/metacriticmustsee<<library_type>>s

collections:
  Common Sense Selection:
    variables:
      style: color
      key: commonsense
    template:
      - name: commonsense
      - name: shared
        translation_key: commonsense_selection
        url_logo: https://raw.githubusercontent.com/Kometa-Team/Default-Images/master/chart/logos/css.png
      - name: arr
      - name: custom

  StevenLu's Popular Movies:
    variables:
      style: color
      key: stevenlu
    stevenlu_popular: true
    template:
      - name: shared
        allowed_libraries: movie
        translation_key:  stevenlu_popular
        url_logo: https://raw.githubusercontent.com/Kometa-Team/Default-Images/master/chart/logos/StevenLu.png
      - name: arr
      - name: custom

  Top 10 Pirated Movies of the Week:
    variables:
      style: color
      key: pirated
    mdblist_list: https://mdblist.com/lists/k0meta/top-ten-pirated-movies-of-the-week-torrent-freakcom
    template:
      - name: shared
        allowed_libraries: movie
        translation_key: pirated_popular
        url_logo: https://raw.githubusercontent.com/Kometa-Team/Default-Images/master/chart/logos/Pirated.png
      - name: arr
      - name: custom

  Metacritic Must See:
    variables:
      style: color
      key: metacritic
    template:
      - name: metacritic
      - name: shared
        translation_key: metacritic_must_see
        url_logo: https://raw.githubusercontent.com/Kometa-Team/Default-Images/master/chart/logos/Metacritic.png
      - name: arr
      - name: custom
