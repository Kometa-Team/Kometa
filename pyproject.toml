[project]
name = "kometa"
version = "2.4.7"
description = "Metadata editor for Plex"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "apprise>=2.1.0",
    "arrapi==1.5.1",
    "cloudscraper==1.2.71",
    "gitpython==3.2.1",
    "jsonschema==4.26.0",
    "langcodes==3.5.1",
    "letterboxdpy==6.6.1",
    "lxml==6.1.3",
    "num2words==0.5.14",
    "packaging==26.3",
    "pathvalidate==3.3.1",
    "pillow==13.0.0",
    "plexapi==4.18.3",
    "pylast==7.2.0",
    "psutil==7.2.2",
    "pyinstrument==5.1.3",
    "python-dateutil==3.0.0",
    "python-dotenv==1.2.4",
    "pywin32==312 ; sys_platform == 'win32'",
    "requests==2.34.2",
    "ruamel-yaml==0.19.1",
    "schedule==1.2.2",
    "serializd-py @ git+https://github.com/Velocidensity/serializd-py.git@1b34bb2ddee12df12bfd19c88d95d489a0bcd483",
    "setuptools==84.2.1",
    "tenacity==9.2.1",
    "tmdbapis==1.3.1",
    "ytmusicapi==1.12.3",
    "resvg-py==0.5.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--tb=short"

[tool.coverage.run]
source = ["modules"]
omit = ["modules/MODULE.md"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "def __repr__",
    "def __str__",
]


[tool.black]
line-length = 256
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 256

[tool.bandit]
exclude_dirs = ["tests", "config", ".venv", "test_venv", ".direnv"]
skips = ["B101"]

[tool.pyright]
# Static type checker (replaces mypy as of this PR).
#
# Strategy: ratcheting baseline. We do NOT require zero errors. We require
# that the error count does not GO UP on a PR. See:
#   - scripts/pyright/baseline.json (current accepted error count)
#   - scripts/pyright_baseline.py (gate logic)
#   - .github/workflows/pyright.yml (CI job)
#
# To opt a single file into stricter checking, add this line at the top:
#   # pyright: strict
#
# To silence a single line (use sparingly!):
#   foo.bar  # pyright: ignore[reportOptionalMemberAccess]
include = ["modules", "kometa.py"]
stubPath = "scripts/pyright/stubs"
exclude = [
    "**/__pycache__",
    "**/.*",
    "**/node_modules",
    ".venv",
    "test_venv",
    ".direnv",
    "build",
    "dist",
    "docs",
    "config",
    "defaults",
    "fonts",
    "json-schema",
    "tests",
]
pythonVersion = "3.12"
pythonPlatform = "Linux"
typeCheckingMode = "basic"

# Third-party packages without type stubs would otherwise generate hundreds
# of false positives. We silence those globally; real errors still surface.
reportMissingImports = "none"
reportMissingTypeStubs = "none"

# Allow gradual typing — don't punish code that simply isn't annotated yet.
reportUnknownArgumentType = "none"
reportUnknownLambdaType = "none"
reportUnknownMemberType = "none"
reportUnknownParameterType = "none"
reportUnknownVariableType = "none"


[tool.uv.sources]
kometa-docs-include = { path = "docs/docs-extension", editable = true }

[dependency-groups]
# uv itself, installed by docker/Dockerfile.base and CI via the hashed export in docker/uv-bootstrap.txt. Not a default group, so never synced.
bootstrap = ["uv==0.13.5"]

# Documentation builds only; excluded from application/runtime installs.
docs = [
    "kometa-docs-include",
    "bracex==3.1",
    "click==8.5.0",
    "colorama==0.4.6 ; sys_platform == 'win32'",
    "deepmerge==3.0.1",
    "jinja2==3.1.6",
    "markdown==3.11.2",
    "markupsafe==3.0.4",
    "pathspec==1.1.1",
    "pygments==2.21.0",
    "pymdown-extensions==12.3",
    "pyyaml==6.0.3",
    "tomli==2.5.0",
    "wcmatch==11.1",
    "zensical==0.0.72",
]

dev = [
    "arrapi==1.5.1",
    "bandit==1.9.4",
    "black==26.10.1",
    "cloudscraper==1.2.71",
    "flake8==7.4.1",
    "gitpython==3.2.1",
    "isort==9.0.2",
    "letterboxdpy==6.6.1",
    "lxml==6.1.3",
    "num2words==0.5.14",
    "packaging==26.3",
    "pathvalidate==3.3.1",
    "pillow==13.0.0",
    "plexapi==4.18.3",
    "pylast==7.2.0",
    "prek==0.5.7",
    "psutil==7.2.2",
    "pyright==1.1.414",
    "pytest==9.1.1",
    "pytest-cov>=7.1.0",
    "responses>=0.26.3",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "python-dateutil==3.0.0",
    "python-dotenv==1.2.4",
    "pywin32==312 ; sys_platform == 'win32'",
    "requests==2.34.2",
    "ruamel-yaml==0.19.1",
    "schedule==1.2.2",
    "serializd-py @ git+https://github.com/Velocidensity/serializd-py.git@1b34bb2ddee12df12bfd19c88d95d489a0bcd483",
    "setuptools==84.2.1",
    "tenacity==9.2.1",
    "tmdbapis==1.3.1",
]
